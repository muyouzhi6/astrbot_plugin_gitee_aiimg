name: astrbot_plugin_gitee_aiimg
display_name: Gitee AI Image
desc: >
  [主要适配 QQ / aiocqhttp，兼容个人微信 weixin_oc] v5 支持 LLM 单图与批量后台生成，生图不阻塞对话；Bot 会持续感知任务状态与安全摘要，完整提示词仅通过按需任务查询读取，并在安全的原会话中按当前人格回应任务终态，通知链路失败时保持静默。另支持多服务商文生图、改图、自拍参考照、视频、预设、精确尺寸、多 Key 轮询和失败兜底。
version: v5.1.18
author: 木有知、Zhalslar
astrbot_version: ">=4.16.0,<5"
support_platforms:
  - aiocqhttp
  - weixin_oc
repo: https://github.com/muyouzhi6/astrbot_plugin_gitee_aiimg
