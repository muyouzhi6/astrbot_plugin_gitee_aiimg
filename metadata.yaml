name: astrbot_plugin_gitee_aiimg
display_name: Gitee AI Image
desc: >
  [主要适配 QQ / aiocqhttp，兼容个人微信 weixin_oc] 内置映像工作台，支持可视化服务商配置、模型列表、拖动回退链路、私人画廊和持久化画布；支持多人物多套形象、中文切换指令和独立穿搭，与 life_scheduler 日程及 ContextAware 历史图片联动。支持单图与批量后台生成、多服务商文生图、改图、自拍、视频、精确尺寸和多 Key 轮询。
version: v5.6.1
author: 木有知、Zhalslar
astrbot_version: ">=4.28.0,<5"
support_platforms:
  - aiocqhttp
  - weixin_oc
repo: https://github.com/muyouzhi6/astrbot_plugin_gitee_aiimg
