name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run Ruff checks
        run: ruff check .

      - name: Verify Ruff formatting
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify studio browser logic
        run: node --test tests/studio_frontend.test.mjs

  native-runtime:
    name: AstrBot ${{ matrix.astrbot-version }} / Python 3.12
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astrbot-version: ["4.26.8", "4.27.3", "4.28.2", "4.29.3"]
    steps:
      - name: Check out repository with migration baseline
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install native runtime and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt AstrBot==${{ matrix.astrbot-version }}

      - name: Verify image processing with the native Pillow version
        run: python -m pytest -q tests/test_image_encoding.py tests/test_image_format.py tests/test_reference_subject.py

      - name: Verify native plugin lifecycle and reference HTTP APIs
        run: python -m pytest -q tests/test_release_compatibility.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify studio browser logic and native page bridge
        env:
          PYTHON: python
        run: node --test tests/*.test.mjs
